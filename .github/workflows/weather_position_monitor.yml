name: Polymarket Weather Intra-Day Position Monitor & Early Exit

on:
  schedule:
    # Run hourly at minute 15 (offset from the top of the hour to capture fresh METAR reports):
    - cron: '15 * * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate exits without closing trades (dry run)'
        required: false
        default: false
        type: boolean
      live_mode:
        description: 'Enable live trading (requires secrets configured)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  monitor-and-exit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install System Dependencies (ecCodes)
        run: |
          sudo apt-get update && sudo apt-get install -y libeccodes-dev

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Intra-Day Position Monitor
        env:
          LIVE: ${{ github.event.inputs.live_mode == 'true' && '1' || vars.LIVE || '0' }}
          FORCE_LIVE: ${{ vars.FORCE_LIVE || '0' }}
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_API_KEY: ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET: ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE: ${{ secrets.POLY_API_PASSPHRASE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          LIVE_FLAG="${{ github.event.inputs.live_mode == 'true' && '--live' || '' }}"
          echo "Executing position monitor with LIVE=$LIVE DRY_RUN=$DRY_RUN"
          python src/main.py monitor $DRY_RUN $LIVE_FLAG

      - name: Commit and Push State Updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Automated early exit state sync [skip ci]"
          file_pattern: "data/*"
