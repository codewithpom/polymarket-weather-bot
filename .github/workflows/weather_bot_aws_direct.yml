name: Polymarket Weather Autonomous Trading Bot (AWS Direct Pipeline)

on:
  schedule:
    # 4 Synoptic model drop windows (UTC) - 15-20 mins earlier to capture direct S3 drops:
    # 03:15 UTC (00z run drop)
    - cron: '15 3 * * *'
    # 09:15 UTC (06z run drop)
    - cron: '15 9 * * *'
    # 15:30 UTC (12z run drop)
    - cron: '30 15 * * *'
    # 21:15 UTC (18z run drop)
    - cron: '15 21 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - scan
          - monitor
          - grade
          - report
          - selftest
          - benchmark
      use_aws_direct:
        description: 'Use direct AWS S3 weather ingestion (1=yes, 0=no)'
        required: false
        default: '1'
        type: string
      live_mode:
        description: 'Enable live trading (requires secrets configured)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install System Dependencies (ecCodes)
        run: |
          sudo apt-get update && sudo apt-get install -y libeccodes-dev

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Offline Verification
        run: |
          python src/main.py selftest

      - name: Execute Trading Workflow
        env:
          USE_AWS_DIRECT: ${{ github.event.inputs.use_aws_direct || '1' }}
          LIVE: ${{ github.event.inputs.live_mode == 'true' && '1' || vars.LIVE || '0' }}
          FORCE_LIVE: ${{ vars.FORCE_LIVE || '0' }}
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_API_KEY: ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET: ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE: ${{ secrets.POLY_API_PASSPHRASE }}
          MIN_EDGE_AFTER_FEE: ${{ vars.MIN_EDGE_AFTER_FEE || '0.04' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ACTION="${{ github.event.inputs.action || 'all' }}"
          echo "Executing action: $ACTION with LIVE=$LIVE and USE_AWS_DIRECT=$USE_AWS_DIRECT"
          if [ "$ACTION" = "selftest" ]; then
            python src/main.py selftest
          elif [ "$ACTION" = "grade" ]; then
            python src/main.py grade
          elif [ "$ACTION" = "monitor" ]; then
            python src/main.py monitor
          elif [ "$ACTION" = "scan" ]; then
            python src/main.py scan
          elif [ "$ACTION" = "report" ]; then
            python src/main.py report
          elif [ "$ACTION" = "benchmark" ]; then
            python tools/benchmark_aws_vs_openmeteo.py --city nyc
          else
            # Default pipeline: Grade settled -> Monitor & early-exit -> Scan & trade -> Report
            python src/main.py grade
            python src/main.py monitor
            python src/main.py scan
            python src/main.py report
          fi

      - name: Commit and Push State Updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Automated trade state sync (AWS direct) [skip ci]"
          file_pattern: "data/*"
